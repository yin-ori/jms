name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Täglich um Mitternacht JST neu bauen, damit die Lesen-Seite frische Goodreads-Daten zeigt
    - cron: '0 15 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Bauen und Veröffentlichen als getrennte Jobs: Im selben Job findet
  # deploy-pages das gerade hochgeladene Artefakt gelegentlich noch nicht.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
